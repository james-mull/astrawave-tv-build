name: Polish AstraWave Settings Once

on:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - ".github/workflows/polish-settings-once.yml"

permissions:
  contents: write

jobs:
  polish-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nuvio-core-rebuild

      - name: Make settings and premium hub customer-facing
        shell: python
        run: |
          from pathlib import Path

          account = Path('android-app/app/src/main/java/com/astrawave/app/ui/AccountUtilityScreen.kt')
          text = account.read_text()
          replacements = [
              ('UtilityShell("Devices & Remote", "Pairing state and handoff capabilities that exist on this device. Live network remote transport remains capability-gated.", onBack)', 'UtilityShell("Devices & Remote", "Pair another AstraWave device and manage remote-control or handoff features available on this device.", onBack)'),
              ('AstraWaveStatePanel("Pairing payload", it)', 'AstraWaveStatePanel("Pairing details", it)'),
              ('label = { Text("Paste AstraWave pairing payload") }', 'label = { Text("Paste pairing code") }'),
              ('"Remote ${if (device.supportsRemote) "supported" else "off"} • Handoff ${if (device.supportsHandoff) "supported" else "off"} • Cast ${if (device.supportsCasting) "supported" else "not advertised"}"', '"Remote ${if (device.supportsRemote) "on" else "off"} • Handoff ${if (device.supportsHandoff) "on" else "off"} • Cast ${if (device.supportsCasting) "on" else "off"}"'),
              ('UtilityShell("Downloads & Storage", "Authorized offline downloads, Travel Mode and local DVR recordings stored on this device.", onBack)', 'UtilityShell("Downloads & Storage", "Manage offline downloads, Travel Mode and recordings stored on this device.", onBack)'),
              ('UtilityToggle("Source health", "Warn when a preferred source repeatedly degrades", sourceHealthEnabled)', 'UtilityToggle("Playback reliability", "Warn when a preferred playback option repeatedly has trouble", sourceHealthEnabled)'),
              ('UtilityShell("Backup & Sync", "Restore private profile library/config state from AstraWave Cloud. Local data remains the fallback when cloud is unavailable.", onBack)', 'UtilityShell("Backup & Sync", "Restore your profile, library and watch progress from AstraWave Cloud when you are signed in.", onBack)'),
              ('Text("Cloud restore does not upload provider passwords. Xtream/debrid/personal-media secrets stay device-local in encrypted storage.", color = AstraWaveColors.TertiaryText, style = MaterialTheme.typography.bodySmall)', 'Text("Connected-service passwords and private media credentials stay encrypted on this device and are not included in cloud restore.", color = AstraWaveColors.TertiaryText, style = MaterialTheme.typography.bodySmall)'),
              ('UtilityShell(section.title, "Profile-scoped playback, language and presentation policy used across AstraWave.", onBack)', 'UtilityShell(section.title, "Choose how AstraWave plays media, handles language and looks for this profile.", onBack)'),
              ('"Playback preset",', '"Playback preference",'),
              ('UtilityToggle("Prefer Real-Debrid / debrid", "Boost eligible debrid-backed sources in Play Best ranking", settings.preferDebrid)', 'UtilityToggle("Prefer connected debrid service", "Use your connected debrid service first when it has an eligible playback option", settings.preferDebrid)'),
              ('UtilityToggle("Prefer HDR / Dolby Vision", "Boost HDR-capable candidates when metadata advertises it", settings.preferHdr)', 'UtilityToggle("Prefer HDR / Dolby Vision", "Choose HDR playback when your device and the available option support it", settings.preferHdr)'),
              ('UtilityToggle("Prefer surround / Atmos", "Boost 5.1, 7.1, Atmos, TrueHD and DTS candidates", settings.preferSurround)', 'UtilityToggle("Prefer surround / Atmos", "Choose multichannel audio when your device and the available option support it", settings.preferSurround)'),
              ('UtilityToggle("AutoNext", "Prepares the next episode policy and continues series playback", settings.autoNextEnabled)', 'UtilityToggle("Autoplay next episode", "Continue to the next episode automatically when available", settings.autoNextEnabled)'),
              ('"Per-device design remains automatic",', '"Optimized for this device",'),
              ('"Phone, tablet and Android TV keep separate density, typography and focus behavior. UI scale fine-tunes that device-specific layout rather than forcing one layout everywhere.",', '"AstraWave automatically adapts layout, text and focus behavior for phone, tablet and TV. UI scale lets you fine-tune the size.",'),
              ('UtilityShell(section.title, "This area is capability-gated until its underlying transport is production-ready.", onBack)', 'UtilityShell(section.title, "This feature is not available in the current customer build yet.", onBack)'),
              ('AstraWaveStatePanel("Not enabled yet", "AstraWave keeps unfinished transports visible in the roadmap but does not label them as working integrations.")', 'AstraWaveStatePanel("Coming Soon", "This area will become available after its customer experience and reliability checks are complete.")'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Account target not found: {old[:100]}')
              text = text.replace(old, new, 1)
          account.write_text(text)

          power = Path('android-app/app/src/main/java/com/astrawave/app/ui/PremiumPowerCenterScreen.kt')
          text = power.read_text()
          replacements = [
              ('var astraResult by remember { mutableStateOf("Ask Astra to find something, open sports, or narrow a watch by runtime and rating.") }', 'var astraResult by remember { mutableStateOf("Ask Astra to help you find something to watch.") }'),
              ('title = "Power Center",', 'title = "Premium Hub",'),
              ('subtitle = "DVR, catch-up capability, predictive source health, downloads, Travel Mode, household viewing and Astra intelligence.",', 'subtitle = "Your premium features, downloads, recordings, household tools and connected services in one place.",'),
              ('PremiumPanel("Astra Concierge", "Natural-language entertainment control")', 'PremiumPanel("Astra Search", "Find something to watch using natural language")'),
              ('PremiumPanel("Smart Source Fusion", "Predictive health and automatic failover")', 'PremiumPanel("Playback Reliability", "Automatic backup playback when available")'),
              ('Text("Connect an IPTV source to start building reliability history.", color = AstraWaveColors.SecondaryText)', 'Text("Connect a Live TV service to see playback reliability here.", color = AstraWaveColors.SecondaryText)'),
              ('Text("${health.score}/100 • ${"%.0f".format(health.uptimePercent)}%", color = if (health.score >= 70) AstraWaveColors.Success else AstraWaveColors.SecondaryText)', 'Text(when { health.score >= 85 -> "Excellent"; health.score >= 70 -> "Good"; else -> "Improving" }, color = if (health.score >= 70) AstraWaveColors.Success else AstraWaveColors.SecondaryText)'),
              ('PremiumPanel("DVR, Catch-up & Timeshift", "Capability-gated recording for authorized providers")', 'PremiumPanel("Recordings", "Recording features for supported connected TV services")'),
              ('Text("Record, catch-up and timeshift controls appear only when the connected provider advertises those capabilities.", color = AstraWaveColors.SecondaryText)', 'Text("Recording controls appear only when a connected service supports them and AstraWave can use them safely.", color = AstraWaveColors.SecondaryText)'),
              ('PremiumPanel("Household Watch", "Movie Night voting and shared decisions")', 'PremiumPanel("Watch Night", "Movie-night voting and shared picks")'),
              ('Text("No active Watch Night yet. Create one from the web Control Center or household tools.", color = AstraWaveColors.SecondaryText)', 'Text("No active Watch Night yet. Create one from your household tools when you are ready.", color = AstraWaveColors.SecondaryText)'),
              ('PremiumPanel("Provider Compatibility", "One entertainment OS")', 'PremiumPanel("Connected Services", "Services AstraWave can work with")'),
              ('Text("Provider-specific playback/catch-up/recording remains capability-gated until that adapter is connected and authorized.", color = AstraWaveColors.TertiaryText)', 'Text("Features appear only after a service is connected and the required capability is available.", color = AstraWaveColors.TertiaryText)'),
              ('PremiumMetric("SOURCES", providers.toString(), Modifier.weight(1f))', 'PremiumMetric("CONNECTED", providers.toString(), Modifier.weight(1f))'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Power target not found: {old[:100]}')
              text = text.replace(old, new, 1)
          power.write_text(text)

      - name: Commit customer settings polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/astrawave/app/ui/AccountUtilityScreen.kt android-app/app/src/main/java/com/astrawave/app/ui/PremiumPowerCenterScreen.kt
          git commit -m "Make premium and account settings customer-facing"
          git push origin HEAD:feature/nuvio-core-rebuild
