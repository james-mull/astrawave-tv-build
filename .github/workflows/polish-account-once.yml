name: Polish My AstraWave Once

on:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - ".github/workflows/polish-account-once.yml"

permissions:
  contents: write

jobs:
  polish-account:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nuvio-core-rebuild
      - name: Replace internal account wording
        shell: python
        run: |
          from pathlib import Path
          path = Path('android-app/app/src/main/java/com/astrawave/app/ui/MyAstraWaveHub.kt')
          text = path.read_text()
          replacements = [
              ('Experience & Parity Settings', 'Experience Settings'),
              ('These profile-scoped preferences keep the Android APK aligned with the web experience while preserving native Android TV behavior.', 'Choose how AstraWave looks, plays, and behaves for this profile.'),
              ('Autoplay best healthy source', 'Automatically choose best playback option'),
              ("Prefer AstraWave's highest-ranked verified source when available.", 'Let AstraWave choose the strongest available option when you press Play.'),
              ('APK ↔ Web parity', 'Across Your Devices'),
              ('Current shared feature families: profiles & Kids, expanded VOD/discovery, title/franchise context, watch progress, sports, Guide, Multiview, source management, personal media, player controls, onboarding, appearance preferences, and diagnostics.', 'Profiles, favorites, watch progress, discovery, sports, Guide, Multiview and personal-media features are designed to stay familiar across AstraWave devices.'),
              ('Android-only capabilities remain native where appropriate, including TV remote focus, Media3 playback, secure personal-media credentials, and device-native PiP.', 'Phone, tablet and TV controls remain optimized for each device, including remote focus and picture-in-picture where supported.'),
              ('Save / confirm profile settings', 'Settings saved automatically'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'target not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Commit account wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/astrawave/app/ui/MyAstraWaveHub.kt
          git commit -m "Make My AstraWave settings customer-facing"
          git push origin HEAD:feature/nuvio-core-rebuild
