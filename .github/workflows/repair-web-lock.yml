name: Repair AstraWave Web Lockfile

on:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - ".github/workflows/repair-web-lock.yml"

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/nuvio-core-rebuild

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate lockfile with npm
        working-directory: web-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit repaired lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web-app/package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-app/package-lock.json
          git commit -m "Sync web package lockfile"
          git push origin HEAD:feature/nuvio-core-rebuild
