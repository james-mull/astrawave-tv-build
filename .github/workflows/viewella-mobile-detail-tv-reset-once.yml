name: Viewella Mobile Detail TV Reset Once

on:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - '.github/workflows/viewella-mobile-detail-tv-reset-once.yml'

permissions:
  contents: write

jobs:
  detail-tv-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nuvio-core-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply TV and detail mobile reset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # TV Continue Watching: flatten on phones and tighten sizing.
          p = Path('android-app/app/src/main/java/com/astrawave/app/ui/TvListsScreen.kt')
          text = p.read_text()
          old = '''                        AstraWaveFocusableCard(\n                            Modifier.width(if (device == AstraWaveDeviceClass.PHONE) 238.dp else 280.dp).clickable { open(progress) },\n                        ) {\n                            Column {\n                                AstraWaveArtwork(\n                                    progress.item.title,\n                                    Modifier.fillMaxWidth(),\n                                    AstraWaveArtworkKind.Backdrop,\n                                )\n                                Spacer(Modifier.height(8.dp))\n                                Text(\n                                    progress.item.title,\n                                    color = AstraWaveColors.PrimaryText,\n                                    style = MaterialTheme.typography.titleMedium,\n                                    maxLines = 1,\n                                )\n                                Spacer(Modifier.height(6.dp))\n                                LinearProgressIndicator(progress = { ratio }, modifier = Modifier.fillMaxWidth())\n                                Spacer(Modifier.height(5.dp))\n                                Text(\n                                    if (ratio > 0f) \"Resume • ${(ratio * 100).toInt()}%\" else \"Continue series\",\n                                    color = AstraWaveColors.AccentStrong,\n                                    style = MaterialTheme.typography.labelMedium,\n                                )\n                            }\n                        }'''
          new = '''                        val phone = device == AstraWaveDeviceClass.PHONE\n                        val body: @Composable () -> Unit = {\n                            Column(Modifier.width(if (phone) 220.dp else 280.dp).clickable { open(progress) }) {\n                                AstraWaveArtwork(\n                                    progress.item.title,\n                                    Modifier.fillMaxWidth(),\n                                    AstraWaveArtworkKind.Backdrop,\n                                )\n                                Spacer(Modifier.height(if (phone) 6.dp else 8.dp))\n                                Text(\n                                    progress.item.title,\n                                    color = AstraWaveColors.PrimaryText,\n                                    style = if (phone) MaterialTheme.typography.bodyMedium else MaterialTheme.typography.titleMedium,\n                                    maxLines = 1,\n                                )\n                                Spacer(Modifier.height(5.dp))\n                                LinearProgressIndicator(progress = { ratio }, modifier = Modifier.fillMaxWidth())\n                                Spacer(Modifier.height(3.dp))\n                                Text(\n                                    if (ratio > 0f) \"Resume ${(ratio * 100).toInt()}%\" else \"Continue\",\n                                    color = AstraWaveColors.AccentStrong,\n                                    style = MaterialTheme.typography.labelSmall,\n                                )\n                            }\n                        }\n                        if (phone) body() else AstraWaveFocusableCard(Modifier.width(280.dp)) { body() }'''
          if old not in text:
              raise SystemExit('TV continue card anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('style = MaterialTheme.typography.headlineSmall,', 'style = if (device == AstraWaveDeviceClass.PHONE) MaterialTheme.typography.titleMedium else MaterialTheme.typography.headlineSmall,', 1)
          text = text.replace('Spacer(Modifier.height(9.dp))', 'Spacer(Modifier.height(if (device == AstraWaveDeviceClass.PHONE) 7.dp else 9.dp))', 1)
          p.write_text(text)

          # Mobile title detail: shorter hero, mobile-sized typography, two primary hero actions,
          # secondary actions below hero instead of one scrolling action strip.
          p = Path('android-app/app/src/main/java/com/astrawave/app/PremiumVodDetailActivity.kt')
          text = p.read_text()
          text = text.replace('val pagePadding = if (device == AstraWaveDeviceClass.PHONE) 18.dp else 34.dp', 'val pagePadding = if (device == AstraWaveDeviceClass.PHONE) 16.dp else 34.dp')
          text = text.replace('val heroHeight = if (device == AstraWaveDeviceClass.PHONE) 500.dp else 590.dp', 'val heroHeight = if (device == AstraWaveDeviceClass.PHONE) 430.dp else 590.dp')
          text = text.replace('val heroTextWidth = if (device == AstraWaveDeviceClass.PHONE) 520.dp else 760.dp', 'val heroTextWidth = if (device == AstraWaveDeviceClass.PHONE) 340.dp else 760.dp')
          text = text.replace('style = MaterialTheme.typography.displayLarge,\n                    fontWeight = FontWeight.Black,', 'style = if (device == AstraWaveDeviceClass.PHONE) MaterialTheme.typography.headlineLarge else MaterialTheme.typography.displayLarge,\n                    fontWeight = FontWeight.Black,', 1)
          text = text.replace('if (meta.isNotBlank()) Text(meta, color = AstraWaveColors.SecondaryText, style = MaterialTheme.typography.bodyLarge)', 'if (meta.isNotBlank()) Text(meta, color = AstraWaveColors.SecondaryText, style = if (device == AstraWaveDeviceClass.PHONE) MaterialTheme.typography.bodySmall else MaterialTheme.typography.bodyLarge)')
          text = text.replace('style = MaterialTheme.typography.bodyLarge,\n                        maxLines = if (device == AstraWaveDeviceClass.PHONE) 3 else 4,', 'style = if (device == AstraWaveDeviceClass.PHONE) MaterialTheme.typography.bodyMedium else MaterialTheme.typography.bodyLarge,\n                        maxLines = if (device == AstraWaveDeviceClass.PHONE) 2 else 4,', 1)

          old_actions = '''                Spacer(Modifier.height(4.dp))\n                Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(10.dp), verticalAlignment = Alignment.CenterVertically) {\n                    AstraWavePrimaryButton(\n                        label = when {\n                            playLoading -> \"Finding a Stream…\"\n                            seriesMode && progress != null -> \"▶ Continue\"\n                            seriesMode -> \"▶ Episodes\"\n                            progress != null -> \"▶ Resume\"\n                            else -> \"▶ Play\"\n                        },\n                        onClick = { if (seriesMode) openDeepDetails() else playBest() },\n                        enabled = !playLoading,\n                    )\n                    details?.videos?.firstOrNull { it.site.equals(\"YouTube\", true) && (it.type.equals(\"Trailer\", true) || it.official) }?.let { trailer ->\n                        AstraWaveSecondaryButton(\"Trailer\") {\n                            runCatching { context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(\"https://www.youtube.com/watch?v=${trailer.key}\"))) }\n                        }\n                    }\n                    AstraWaveSecondaryButton(if (inMyList) \"✓ My List\" else \"+ My List\") {\n                        val enabled = !inMyList\n                        library.setWatchlist(\n                            WatchlistEntry(profileId = profileId, item = libraryItem),\n                            enabled = enabled,\n                        )\n                        inMyList = enabled\n                    }\n                    AstraWaveSecondaryButton(if (showSources) \"Hide\" else \"Watch Options\") {\n                        if (showSources) showSources = false else loadSources()\n                    }\n                    AstraWaveSecondaryButton(if (seriesMode) \"Episodes\" else \"Details\") { openDeepDetails() }\n                }'''
          new_actions = '''                Spacer(Modifier.height(4.dp))\n                Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp), verticalAlignment = Alignment.CenterVertically) {\n                    AstraWavePrimaryButton(\n                        label = when {\n                            playLoading -> \"Finding…\"\n                            seriesMode && progress != null -> \"Continue\"\n                            seriesMode -> \"Episodes\"\n                            progress != null -> \"Resume\"\n                            else -> \"Play\"\n                        },\n                        onClick = { if (seriesMode) openDeepDetails() else playBest() },\n                        enabled = !playLoading,\n                    )\n                    AstraWaveSecondaryButton(if (inMyList) \"In My List\" else \"My List\") {\n                        val enabled = !inMyList\n                        library.setWatchlist(WatchlistEntry(profileId = profileId, item = libraryItem), enabled = enabled)\n                        inMyList = enabled\n                    }\n                }'''
          if old_actions not in text:
              raise SystemExit('detail hero actions anchor not found')
          text = text.replace(old_actions, new_actions, 1)

          marker = '''        if (showSources && !seriesMode) {'''
          secondary = '''        if (device == AstraWaveDeviceClass.PHONE) {\n            Row(\n                Modifier.fillMaxWidth().padding(horizontal = pagePadding, vertical = 10.dp).horizontalScroll(rememberScrollState()),\n                horizontalArrangement = Arrangement.spacedBy(8.dp),\n            ) {\n                details?.videos?.firstOrNull { it.site.equals(\"YouTube\", true) && (it.type.equals(\"Trailer\", true) || it.official) }?.let { trailer ->\n                    AstraWaveSecondaryButton(\"Trailer\") {\n                        runCatching { context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(\"https://www.youtube.com/watch?v=${trailer.key}\"))) }\n                    }\n                }\n                AstraWaveSecondaryButton(if (showSources) \"Hide options\" else \"Watch options\") {\n                    if (showSources) showSources = false else loadSources()\n                }\n                AstraWaveSecondaryButton(if (seriesMode) \"Episodes\" else \"More details\") { openDeepDetails() }\n            }\n        }\n\n'''
          if marker not in text:
              raise SystemExit('detail secondary insert anchor not found')
          text = text.replace(marker, secondary + marker, 1)
          p.write_text(text)
          PY
      - name: Compile TV and detail reset
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin
      - name: Commit TV and detail reset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/astrawave/app/PremiumVodDetailActivity.kt \
                  android-app/app/src/main/java/com/astrawave/app/ui/TvListsScreen.kt
          git commit -m "Reset mobile TV and title detail visuals"
          git push origin HEAD:feature/nuvio-core-rebuild
