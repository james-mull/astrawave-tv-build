name: Viewella Mobile System Live Search Reset Once

on:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - '.github/workflows/viewella-mobile-system-live-search-reset-once.yml'

permissions:
  contents: write

jobs:
  system-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nuvio-core-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply mobile system, Live, Guide and Search reset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Global phone design language: smaller radii + tighter section rhythm.
          p = Path('android-app/app/src/main/java/com/astrawave/app/ui/AstraWaveTheme.kt')
          text = p.read_text()
          text = text.replace('''private val AstraWavePhoneShapes = Shapes(\n    extraSmall = RoundedCornerShape(6.dp),\n    small = RoundedCornerShape(10.dp),\n    medium = RoundedCornerShape(14.dp),\n    large = RoundedCornerShape(18.dp),\n    extraLarge = RoundedCornerShape(24.dp),\n)''', '''private val AstraWavePhoneShapes = Shapes(\n    extraSmall = RoundedCornerShape(4.dp),\n    small = RoundedCornerShape(7.dp),\n    medium = RoundedCornerShape(10.dp),\n    large = RoundedCornerShape(12.dp),\n    extraLarge = RoundedCornerShape(16.dp),\n)''')
          text = text.replace('AstraWaveDeviceClass.PHONE -> spacing', 'AstraWaveDeviceClass.PHONE -> spacing.copy(section = 30.dp)')
          p.write_text(text)

          # Live mobile: smaller title, flatter channel rows, less vertical chrome.
          p = Path('android-app/app/src/main/java/com/astrawave/app/ui/LiveTvHubScreen.kt')
          text = p.read_text()
          text = text.replace('Text("Live TV", color = AstraWaveColors.PrimaryText, style = MaterialTheme.typography.headlineLarge)', 'Text("Live TV", color = AstraWaveColors.PrimaryText, style = if (isPhone) MaterialTheme.typography.titleLarge else MaterialTheme.typography.headlineLarge)', 1)
          text = text.replace('Spacer(Modifier.height(12.dp))', 'Spacer(Modifier.height(if (isPhone) 7.dp else 12.dp))', 1)
          old = '''                AstraWaveFocusableCard(\n                    Modifier.fillMaxWidth().clickable { onSelect(p.channelId) },\n                ) {\n                    Column(Modifier.fillMaxWidth()) {'''
          new = '''                Column(\n                    Modifier.fillMaxWidth()\n                        .background(if (selected) AstraWaveColors.SurfaceRaised else AstraWaveColors.Background)\n                        .clickable { onSelect(p.channelId) }\n                        .padding(horizontal = 12.dp, vertical = 10.dp),\n                ) {'''
          if old not in text:
              raise SystemExit('phone live card start not found')
          text = text.replace(old, new, 1)
          old_close = '''                        }\n                    }\n                }\n                Spacer(Modifier.height(7.dp))'''
          new_close = '''                        }\n                    }\n                Spacer(Modifier.height(2.dp))'''
          if old_close not in text:
              raise SystemExit('phone live card close not found')
          text = text.replace(old_close, new_close, 1)
          text = text.replace('shape = MaterialTheme.shapes.large,\n    ) { Text(label, maxLines = 1) }', 'shape = if (LocalAstraWaveDeviceClass.current == AstraWaveDeviceClass.PHONE) MaterialTheme.shapes.small else MaterialTheme.shapes.large,\n    ) { Text(label, maxLines = 1) }', 1)
          p.write_text(text)

          # Guide mobile: remove stats/dashboard feel and flatten program rows.
          p = Path('android-app/app/src/main/java/com/astrawave/app/ui/GuideScreen.kt')
          text = p.read_text()
          old = '''        AstraWavePageHeader(\n            title = "Guide",\n            subtitle = if (isPhone) "Now and next" else "Now and next across your channels",\n        )\n        Spacer(Modifier.height(if (isPhone) 8.dp else 12.dp))'''
          new = '''        if (isPhone) {\n            Text("Guide", color = AstraWaveColors.PrimaryText, style = MaterialTheme.typography.titleLarge)\n            Spacer(Modifier.height(7.dp))\n        } else {\n            AstraWavePageHeader(title = "Guide", subtitle = "Now and next across your channels")\n            Spacer(Modifier.height(12.dp))\n        }'''
          if old not in text:
              raise SystemExit('guide header anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('''                GuideSummaryRail(snapshot, current.customized, current.epgOverrides)\n                Spacer(Modifier.height(12.dp))''', '''                if (!isPhone) {\n                    GuideSummaryRail(snapshot, current.customized, current.epgOverrides)\n                    Spacer(Modifier.height(12.dp))\n                }''', 1)
          old = '''    AstraWaveFocusableCard(Modifier.fillMaxWidth().clickable(onClick = onPlay)) {\n        Column(verticalArrangement = Arrangement.spacedBy(7.dp)) {'''
          new = '''    Column(\n        Modifier.fillMaxWidth().background(AstraWaveColors.Background).clickable(onClick = onPlay)\n            .padding(horizontal = 10.dp, vertical = 9.dp),\n        verticalArrangement = Arrangement.spacedBy(5.dp),\n    ) {'''
          if old not in text:
              raise SystemExit('phone guide card start not found')
          text = text.replace(old, new, 1)
          old_close = '''            }\n        }\n    }\n}\n\n@Composable\nprivate fun TimelineHeader'''
          new_close = '''            }\n        }\n}\n\n@Composable\nprivate fun TimelineHeader'''
          if old_close not in text:
              raise SystemExit('phone guide card close not found')
          text = text.replace(old_close, new_close, 1)
          p.write_text(text)

          # Search mobile: search field first, no explanatory page-header block, tighter rhythm.
          p = Path('android-app/app/src/main/java/com/astrawave/app/ui/UniversalSearchScreen.kt')
          text = p.read_text()
          text = text.replace('contentPadding = PaddingValues(horizontal = if (device == AstraWaveDeviceClass.PHONE) 16.dp else 24.dp, vertical = 20.dp),', 'contentPadding = PaddingValues(horizontal = if (device == AstraWaveDeviceClass.PHONE) 16.dp else 24.dp, vertical = if (device == AstraWaveDeviceClass.PHONE) 8.dp else 20.dp),')
          text = text.replace('verticalArrangement = Arrangement.spacedBy(14.dp),', 'verticalArrangement = Arrangement.spacedBy(if (device == AstraWaveDeviceClass.PHONE) 10.dp else 14.dp),', 1)
          old = '''        item {\n            AstraWavePageHeader(\n                title = if (isKids) "Kids Search" else "Search",\n                subtitle = if (isKids) "Find movies and shows allowed for this profile." else "Find movies, shows, live TV, sports, music and your own media.",\n            )\n        }\n'''
          new = '''        if (device != AstraWaveDeviceClass.PHONE) {\n            item {\n                AstraWavePageHeader(\n                    title = if (isKids) "Kids Search" else "Search",\n                    subtitle = if (isKids) "Find movies and shows allowed for this profile." else "Find movies, shows, live TV, sports, music and your own media.",\n                )\n            }\n        }\n'''
          if old not in text:
              raise SystemExit('search header anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('placeholder = { Text(if (isKids) "Search movies and shows" else "Search titles, teams, channels, artists…") },', 'placeholder = { Text(if (isKids) "Search movies and shows" else if (device == AstraWaveDeviceClass.PHONE) "Search" else "Search titles, teams, channels, artists…") },', 1)
          text = text.replace('RoundedCornerShape(18.dp)', 'MaterialTheme.shapes.medium', 1)
          p.write_text(text)
          PY
      - name: Compile mobile system reset
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin
      - name: Commit mobile system reset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/astrawave/app/ui/AstraWaveTheme.kt \
                  android-app/app/src/main/java/com/astrawave/app/ui/LiveTvHubScreen.kt \
                  android-app/app/src/main/java/com/astrawave/app/ui/GuideScreen.kt \
                  android-app/app/src/main/java/com/astrawave/app/ui/UniversalSearchScreen.kt
          git commit -m "Reset mobile design system Live Guide and Search"
          git push origin HEAD:feature/nuvio-core-rebuild
