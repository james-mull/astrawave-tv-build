name: Polish Content Sources Once

on:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - '.github/workflows/polish-content-sources-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nuvio-core-rebuild
          fetch-depth: 0

      - name: Make content sources customer-facing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/com/astrawave/app/ui/StremioAddonScreen.kt')
          text = p.read_text()
          replacements = {
            'title = "Sources & Addons"': 'title = "Content Sources"',
            'subtitle = "Reviewed catalogs bootstrap automatically. Personal connections remain separate, and community repositories stay opt-in."': 'subtitle = "Connect the services and catalogs you want AstraWave to use. Recommended sources are ready by default, while personal and community connections stay under your control."',
            'Text("Install Stremio Addon")': 'Text("Connect Source")',
            'label = "Authorized VOD Providers"': 'label = "Streaming Providers"',
            'label = "Cloud & Debrid"': 'label = "Cloud & Debrid"',
            'label = "Playback Diagnostics"': 'label = "Playback Info"',
            '"Restoring reviewed defaults…"': '"Preparing recommended sources…"',
            '"Checking AstraWave\'s reviewed catalog and subtitle manifests in the background."': '"AstraWave is loading the recommended catalogs and subtitle services for this profile."',
            '"Source setup needs attention"': '"Connection needs attention"',
            'AstraWaveSectionHeader("Recommended Pack", "$activeRecommendedCount/${recommendedRepos.size} reviewed repositories active")': 'AstraWaveSectionHeader("Recommended Sources", "$activeRecommendedCount/${recommendedRepos.size} ready")',
            '"Recommended pack enabled"': '"Recommended sources ready"',
            'message = "Official/reviewed Stremio catalogs, subtitles, free Live TV, radio, podcasts and provider-availability sources are AstraWave defaults. Advanced community repos are never silently authorized for playback."': 'message = "AstraWave enables its recommended catalogs, subtitles, free Live TV, radio, podcasts, and provider-availability services by default. Community sources always remain optional."',
            'tierLabel = "Recommended • reviewed default"': 'tierLabel = "Recommended"',
            'AstraWaveSectionHeader("Connected / Installed", "Reviewed defaults plus addons installed by you")': 'AstraWaveSectionHeader("Connected Sources", "Services and catalogs connected to this profile")',
            '"No compatible addon manifests loaded"': '"No additional sources connected"',
            '"Use Refresh/return to this page to retry reviewed defaults, or install a compatible manifest you are authorized to use."': '"AstraWave will keep its recommended sources available. You can also connect another compatible source you are authorized to use."',
            'tierLabel = "Connected by you • custom"': 'tierLabel = "Connected by you"',
            'AstraWaveSectionHeader("Advanced Community Sources", "${advancedRepos.count { it.enabled }} enabled • ${advancedRepos.size} available")': 'AstraWaveSectionHeader("Community Sources", "Advanced • ${advancedRepos.count { it.enabled }} connected • ${advancedRepos.size} available")',
            '"Community repositories are discoverable for power users but are not trusted or executed automatically. Stream-capable extensions still require AstraWave authorization and health checks."': '"Optional community sources are for advanced users. AstraWave never enables them automatically, and playback still requires your authorization."',
            'tierLabel = "Advanced • community • opt-in"': 'tierLabel = "Advanced • optional"',
            'AstraWaveSectionHeader("Enabled Addon Catalogs", "Metadata from active compatible addons")': 'AstraWaveSectionHeader("Available Catalogs", "Titles provided by connected compatible sources")',
            '"Loading addon catalogs…"': '"Loading connected catalogs…"',
            '"Refreshing metadata from enabled compatible addons."': '"Refreshing titles from your connected sources."',
            '"No addon catalogs returned"': '"No connected catalogs returned titles"',
            '"The enabled manifests did not return catalog rows. AstraWave\'s native TMDB/Ultra MAX discovery remains separate from addon playback sources."': '"Your connected sources did not return catalog titles right now. AstraWave discovery remains available separately."',
            'title = { Text("Install Stremio Addon") }': 'title = { Text("Connect Content Source") }',
            'Text("Enter the addon manifest URL. AstraWave will load the manifest before saving it.")': 'Text("Enter the source manifest URL. AstraWave checks it before saving the connection.")',
            'label = { Text("Manifest URL") }': 'label = { Text("Source URL") }',
            'Text("Checking manifest…")': 'Text("Checking source…")',
            'Text("Install")': 'Text("Connect")',
            'Text(if (repo.enabled) "Disable repo" else "Enable repo"': 'Text(if (repo.enabled) "Disconnect" else "Connect"',
            'Text("${row.catalog.name} • ${row.addonName}"': 'Text("${row.catalog.name} • ${row.addonName}"',
            'Text("Catalog metadata • playable streams remain authorization-gated"': 'Text("Catalog titles • playback remains authorization-gated"',
            'Text("v${addon.manifest.version} • ${addon.manifest.id}"': 'Text("Version ${addon.manifest.version}"',
            'Text("Resources: $resources"': 'Text("Capabilities: $resources"',
            'Text("Catalogs: ${addon.manifest.catalogs.size}"': 'Text("Catalogs: ${addon.manifest.catalogs.size}"',
            'result.onFailure { throwable -> error = throwable.message ?: "Unable to install addon" }': 'result.onFailure { throwable -> error = throwable.message ?: "Unable to connect source" }',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Compile customer-facing source setup
        working-directory: android-app
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Commit source setup polish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/astrawave/app/ui/StremioAddonScreen.kt
          git commit -m "Make content sources customer-facing"
          git push origin HEAD:feature/nuvio-core-rebuild
