name: Build AstraWave EPG Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - 'scripts/build_astrawave_epg.py'
      - '.github/workflows/build-astrawave-epg.yml'

permissions:
  contents: write

concurrency:
  group: astrwave-epg-cache
  cancel-in-progress: true

jobs:
  build-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nuvio-core-rebuild
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact guide cache
        run: python scripts/build_astrawave_epg.py
      - name: Validate cache
        run: |
          test -s astrwave-epg/us.json.gz || test -s astrawave-epg/us.json.gz
          python - <<'PY'
          import gzip, json
          p='astrawave-epg/us.json.gz'
          with gzip.open(p,'rt',encoding='utf-8') as f: d=json.load(f)
          assert d.get('scheduledChannels',0) > 0, d
          assert d.get('linkedChannels',0) > 0, d
          print('EPG cache validated:', d['linkedChannels'], 'channels')
          PY
      - name: Publish last-known-good cache
        run: |
          git config user.name 'AstraWave EPG Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astrawave-epg/us.json.gz
          if git diff --cached --quiet; then
            echo 'No EPG cache changes.'
          else
            git commit -m 'Refresh AstraWave EPG cache [skip ci]'
            git push origin HEAD:feature/nuvio-core-rebuild
          fi
