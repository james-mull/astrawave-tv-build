name: Fix Color Import Once

on:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - '.github/workflows/fix-color-import-once.yml'

permissions:
  contents: write

jobs:
  fix-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nuvio-core-rebuild
          fetch-depth: 0
      - name: Add Color import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/com/astrawave/app/RebuildMainActivity.kt')
          text = p.read_text()
          target = 'import androidx.compose.ui.graphics.vector.ImageVector\n'
          if 'import androidx.compose.ui.graphics.Color\n' not in text:
              if target not in text:
                  raise SystemExit('ImageVector import anchor not found')
              text = text.replace(target, 'import androidx.compose.ui.graphics.Color\n' + target, 1)
              p.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app/app/src/main/java/com/astrawave/app/RebuildMainActivity.kt
          if git diff --cached --quiet; then
            echo 'Color import already present.'
          else
            git commit -m 'Add Compose Color import for mobile navigation reset'
            git push origin HEAD:feature/nuvio-core-rebuild
          fi
