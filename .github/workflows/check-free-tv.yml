name: Check AstraWave Free TV

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - "astrawave-free-tv/check_free_tv.py"
      - "astrawave-free-tv/sources.json"
      - ".github/workflows/check-free-tv.yml"
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check rights-gated streams and build playlist
        run: python astrawave-free-tv/check_free_tv.py
      - name: Commit refreshed status and playlist
        run: |
          git config user.name "astrawave-bot"
          git config user.email "actions@users.noreply.github.com"
          git add astrawave-free-tv/status.json astrawave-free-tv/astrawave-free-tv.m3u
          git diff --cached --quiet || git commit -m "Refresh AstraWave Free TV health"
          git push origin HEAD:${GITHUB_REF_NAME}
