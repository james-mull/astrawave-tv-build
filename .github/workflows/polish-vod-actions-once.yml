name: Polish VOD Actions Once

on:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - ".github/workflows/polish-vod-actions-once.yml"

permissions:
  contents: write

jobs:
  polish-vod-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nuvio-core-rebuild
      - name: Make VOD action row phone-safe
        shell: python
        run: |
          from pathlib import Path
          path = Path('android-app/app/src/main/java/com/astrawave/app/PremiumVodDetailActivity.kt')
          text = path.read_text()
          old_import = 'import androidx.compose.foundation.clickable\n'
          new_import = 'import androidx.compose.foundation.clickable\nimport androidx.compose.foundation.horizontalScroll\n'
          old_row = '                Row(horizontalArrangement = Arrangement.spacedBy(10.dp), verticalAlignment = Alignment.CenterVertically) {'
          new_row = '                Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(10.dp), verticalAlignment = Alignment.CenterVertically) {'
          if old_import not in text:
              raise SystemExit('import anchor not found')
          if old_row not in text:
              raise SystemExit('hero action row anchor not found')
          text = text.replace(old_import, new_import, 1)
          text = text.replace(old_row, new_row, 1)
          path.write_text(text)
      - name: Commit VOD action polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/astrawave/app/PremiumVodDetailActivity.kt
          git commit -m "Keep VOD hero actions usable on phones"
          git push origin HEAD:feature/nuvio-core-rebuild
