name: AstraWave Device Smoke QA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - '.github/workflows/device-smoke.yml'
      - '.github/scripts/device-smoke.sh'
      - 'android-app/app/src/main/**'
      - 'android-app/app/build.gradle.kts'

permissions:
  contents: read

concurrency:
  group: astrawave-device-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.name }} smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Phone
            target: google_apis
            profile: pixel_6
            api: 35
            mode: phone
          - name: Tablet
            target: google_apis
            profile: pixel_c
            api: 35
            mode: tablet
          - name: Android-TV
            target: google_apis
            profile: tv_1080p
            api: 35
            mode: tv

    env:
      ASTRAWAVE_FIREBASE_API_KEY: ${{ secrets.ASTRAWAVE_FIREBASE_API_KEY }}
      ASTRAWAVE_FIREBASE_APP_ID: ${{ secrets.ASTRAWAVE_FIREBASE_APP_ID }}
      ASTRAWAVE_FIREBASE_PROJECT_ID: ${{ secrets.ASTRAWAVE_FIREBASE_PROJECT_ID }}
      ASTRAWAVE_FIREBASE_SENDER_ID: ${{ secrets.ASTRAWAVE_FIREBASE_SENDER_ID }}
      ASTRAWAVE_TMDB_BEARER_TOKEN: ${{ secrets.ASTRAWAVE_TMDB_BEARER_TOKEN }}
      ASTRAWAVE_API_BASE_URL: ${{ secrets.ASTRAWAVE_API_BASE_URL }}
      ASTRAWAVE_PREMIUM_PRODUCT_ID: ${{ secrets.ASTRAWAVE_PREMIUM_PRODUCT_ID }}
      ASTRAWAVE_GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and run AstraWave smoke checks
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 2
          ram-size: 4096
          heap-size: 512
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: android-app
          script: bash ../.github/scripts/device-smoke.sh '${{ matrix.mode }}'

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrawave-device-smoke-${{ matrix.mode }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: device-smoke/${{ matrix.mode }}/
