name: Fix Mobile Shell Choppiness Once

on:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - '.github/workflows/fix-mobile-shell-choppiness-once.yml'

permissions:
  contents: write

jobs:
  fix-mobile-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nuvio-core-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Remove top bar and stabilize bottom dock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/com/astrawave/app/RebuildMainActivity.kt')
          text = p.read_text()

          top_call = '''            if (isPhone && current != RebuildDestination.Profiles) {\n                MobileStreamingTopBar(\n                    current = current,\n                    avatar = activeProfile.avatar,\n                    onProfile = { current = RebuildDestination.My },\n                )\n            }\n'''
          if top_call not in text:
              raise SystemExit('mobile top bar call not found')
          text = text.replace(top_call, '', 1)

          old_close = '''            }\n\n            }\n            if (isPhone && current != RebuildDestination.Profiles) {\n                MobileStreamingBottomBar(\n'''
          new_close = '''            }\n\n                if (isPhone && current != RebuildDestination.Profiles && current != RebuildDestination.My) {\n                    Box(\n                        Modifier.align(Alignment.TopEnd)\n                            .padding(top = 10.dp, end = 12.dp)\n                            .width(40.dp)\n                            .height(40.dp)\n                            .background(AstraWaveColors.SurfaceRaised, RoundedCornerShape(999.dp))\n                            .clickable { current = RebuildDestination.My },\n                        contentAlignment = Alignment.Center,\n                    ) {\n                        Text(activeProfile.avatar, style = MaterialTheme.typography.titleMedium)\n                    }\n                }\n            }\n            if (isPhone && current != RebuildDestination.Profiles) {\n                MobileStreamingBottomBar(\n'''
          if old_close not in text:
              raise SystemExit('content box close anchor not found')
          text = text.replace(old_close, new_close, 1)

          start = text.index('@Composable\nprivate fun MobileStreamingTopBar(')
          end = text.index('@Composable\nprivate fun MobileStreamingBottomBar(', start)
          text = text[:start] + text[end:]

          old_bottom = '''@Composable\nprivate fun MobileStreamingBottomBar(\n    current: RebuildDestination,\n    items: List<RebuildDestination>,\n    onSelect: (RebuildDestination) -> Unit,\n) {\n    Row(\n        Modifier.fillMaxWidth().background(AstraWaveColors.BackgroundRaised).padding(horizontal = 4.dp, vertical = 5.dp),\n        horizontalArrangement = Arrangement.SpaceEvenly,\n        verticalAlignment = Alignment.CenterVertically,\n    ) {\n        items.forEach { item ->\n            val selected = current == item\n            Column(\n                Modifier.weight(1f).clickable { onSelect(item) }.padding(vertical = 4.dp),\n                horizontalAlignment = Alignment.CenterHorizontally,\n            ) {\n                if (selected) {\n                    Spacer(\n                        Modifier.width(26.dp).height(2.dp)\n                            .background(AstraWaveColors.AccentStrong, RoundedCornerShape(999.dp)),\n                    )\n                } else {\n                    Spacer(Modifier.height(2.dp))\n                }\n                Spacer(Modifier.height(4.dp))\n                Icon(\n                    item.icon,\n                    contentDescription = item.label,\n                    tint = if (selected) AstraWaveColors.PrimaryText else AstraWaveColors.TertiaryText,\n                )\n                if (selected) {\n                    Spacer(Modifier.height(2.dp))\n                    Text(\n                        item.label,\n                        color = AstraWaveColors.PrimaryText,\n                        style = MaterialTheme.typography.labelSmall,\n                        maxLines = 1,\n                    )\n                }\n            }\n        }\n    }\n}\n'''
          new_bottom = '''@Composable\nprivate fun MobileStreamingBottomBar(\n    current: RebuildDestination,\n    items: List<RebuildDestination>,\n    onSelect: (RebuildDestination) -> Unit,\n) {\n    Row(\n        Modifier.fillMaxWidth().height(64.dp)\n            .background(AstraWaveColors.BackgroundRaised)\n            .padding(horizontal = 6.dp, vertical = 4.dp),\n        horizontalArrangement = Arrangement.SpaceEvenly,\n        verticalAlignment = Alignment.CenterVertically,\n    ) {\n        items.forEach { item ->\n            val selected = current == item\n            Column(\n                Modifier.weight(1f).fillMaxHeight()\n                    .background(\n                        if (selected) AstraWaveColors.SurfaceRaised else AstraWaveColors.BackgroundRaised,\n                        RoundedCornerShape(14.dp),\n                    )\n                    .clickable { onSelect(item) }\n                    .padding(vertical = 5.dp),\n                horizontalAlignment = Alignment.CenterHorizontally,\n                verticalArrangement = Arrangement.Center,\n            ) {\n                Icon(\n                    item.icon,\n                    contentDescription = item.label,\n                    tint = if (selected) AstraWaveColors.AccentStrong else AstraWaveColors.TertiaryText,\n                )\n                Spacer(Modifier.height(2.dp))\n                Text(\n                    item.label,\n                    color = if (selected) AstraWaveColors.PrimaryText else AstraWaveColors.TertiaryText,\n                    style = MaterialTheme.typography.labelSmall,\n                    maxLines = 1,\n                )\n            }\n        }\n    }\n}\n'''
          if old_bottom not in text:
              raise SystemExit('old mobile bottom bar not found')
          text = text.replace(old_bottom, new_bottom, 1)
          p.write_text(text)
          PY

      - name: Compile mobile shell fix
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Commit mobile shell fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/astrawave/app/RebuildMainActivity.kt
          git commit -m "Remove mobile top bar and stabilize bottom navigation"
          git push origin HEAD:feature/nuvio-core-rebuild
