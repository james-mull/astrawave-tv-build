name: Build AstraWave Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-unified-app
      - feature/nuvio-core-rebuild
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
      - ".github/workflows/build-release-candidate.yml"

concurrency:
  group: astrwave-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASTRAWAVE_TMDB_BEARER_TOKEN: ${{ secrets.ASTRAWAVE_TMDB_BEARER_TOKEN }}
      ASTRAWAVE_FIREBASE_API_KEY: ${{ secrets.ASTRAWAVE_FIREBASE_API_KEY }}
      ASTRAWAVE_FIREBASE_APP_ID: ${{ secrets.ASTRAWAVE_FIREBASE_APP_ID }}
      ASTRAWAVE_FIREBASE_PROJECT_ID: ${{ secrets.ASTRAWAVE_FIREBASE_PROJECT_ID }}
      ASTRAWAVE_FIREBASE_SENDER_ID: ${{ secrets.ASTRAWAVE_FIREBASE_SENDER_ID }}
      ASTRAWAVE_API_BASE_URL: ${{ secrets.ASTRAWAVE_API_BASE_URL }}
      ASTRAWAVE_PREMIUM_PRODUCT_ID: ${{ secrets.ASTRAWAVE_PREMIUM_PRODUCT_ID }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Repository validation
        run: |
          test -f android-app/gradlew
          test -f android-app/settings.gradle.kts
          test -f android-app/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler preflight
        working-directory: android-app
        run: ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Free TV registry integrity
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --tests "*FreeTv*" --stacktrace --no-daemon

      - name: Debug lint
        working-directory: android-app
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Release lint
        working-directory: android-app
        run: ./gradlew lintRelease --stacktrace --no-daemon

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare optional release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ASTRAWAVE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android-app/astrawave-release.jks"
            echo "ASTRAWAVE_RELEASE_STORE_FILE=astrawave-release.jks" >> "$GITHUB_ENV"
            echo "ASTRAWAVE_RELEASE_STORE_PASSWORD=${{ secrets.ASTRAWAVE_RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ASTRAWAVE_RELEASE_KEY_ALIAS=${{ secrets.ASTRAWAVE_RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ASTRAWAVE_RELEASE_KEY_PASSWORD=${{ secrets.ASTRAWAVE_RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "Release signing secret is not configured; release artifacts will use the repository's unsigned release configuration."
          fi

      - name: Build release APK and AAB
        working-directory: android-app
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Validate release signatures when configured
        run: |
          if [ -n "${ASTRAWAVE_RELEASE_STORE_FILE:-}" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
            test -n "$APKSIGNER"
            find android-app/app/build/outputs/apk/release -name "*.apk" -print -exec "$APKSIGNER" verify --verbose {} \;
          else
            echo "Skipped signature validation because no release keystore is configured."
          fi

      - name: Generate release provenance and SHA-256 checksums
        run: |
          mkdir -p release-candidate
          find android-app/app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-candidate/ \;
          find android-app/app/build/outputs/apk/release -name "*.apk" -exec cp {} release-candidate/ \;
          find android-app/app/build/outputs/bundle/release -name "*.aab" -exec cp {} release-candidate/ \;
          (
            cd release-candidate
            sha256sum *.apk *.aab > SHA256SUMS.txt
          )
          cat > release-candidate/PROVENANCE.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF}
          workflow_run=${GITHUB_RUN_ID}
          built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: astrwave-release-candidate-${{ github.sha }}
          path: release-candidate/*
          if-no-files-found: error
