name: Build AstraWave Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - "android-app/**"
      - "astrawave-free-tv/**"
      - "docs/ASTRAWAVE_MASTER_REBUILD_PLAN.md"
      - "docs/ASTRAWAVE_V1_SOURCE_OF_TRUTH.md"
      - ".github/workflows/build-release-candidate.yml"

permissions:
  contents: read

concurrency:
  group: astrawave-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    env:
      ASTRAWAVE_FIREBASE_API_KEY: ${{ secrets.ASTRAWAVE_FIREBASE_API_KEY }}
      ASTRAWAVE_FIREBASE_APP_ID: ${{ secrets.ASTRAWAVE_FIREBASE_APP_ID }}
      ASTRAWAVE_FIREBASE_PROJECT_ID: ${{ secrets.ASTRAWAVE_FIREBASE_PROJECT_ID }}
      ASTRAWAVE_FIREBASE_SENDER_ID: ${{ secrets.ASTRAWAVE_FIREBASE_SENDER_ID }}
      ASTRAWAVE_TMDB_BEARER_TOKEN: ${{ secrets.ASTRAWAVE_TMDB_BEARER_TOKEN }}
      ASTRAWAVE_RELEASE_KEYSTORE_B64: ${{ secrets.ASTRAWAVE_RELEASE_KEYSTORE_B64 }}
      ASTRAWAVE_RELEASE_STORE_PASSWORD: ${{ secrets.ASTRAWAVE_RELEASE_STORE_PASSWORD }}
      ASTRAWAVE_RELEASE_KEY_ALIAS: ${{ secrets.ASTRAWAVE_RELEASE_KEY_ALIAS }}
      ASTRAWAVE_RELEASE_KEY_PASSWORD: ${{ secrets.ASTRAWAVE_RELEASE_KEY_PASSWORD }}
      ASTRAWAVE_GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Repository validation
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feature/nuvio-core-rebuild"
          test -f android-app/settings.gradle.kts
          test -f android-app/app/build.gradle.kts
          test -f android-app/app/src/main/AndroidManifest.xml
          test -f astrawave-free-tv/check_free_tv.py
          test -f docs/ASTRAWAVE_MASTER_REBUILD_PLAN.md
          test -f docs/ASTRAWAVE_V1_SOURCE_OF_TRUTH.md
          echo "Validated branch=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler preflight
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin :app:compileReleaseKotlin

      - name: Unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Free TV registry integrity
        working-directory: .
        run: python3 astrawave-free-tv/check_free_tv.py

      - name: Debug lint
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:lintDebug
          status=$?
          echo "===== FULL DEBUG LINT REPORTS ====="
          find app/build/intermediates -name 'lint-results-*.txt' -type f -print -exec cat {} \; || true
          exit "$status"

      - name: Release lint
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:lintRelease
          status=$?
          echo "===== FULL RELEASE LINT REPORTS ====="
          find app/build/intermediates -name 'lint-results-*.txt' -type f -print -exec cat {} \; || true
          exit "$status"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare optional release signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ASTRAWAVE_RELEASE_KEYSTORE_B64:-}" && -n "${ASTRAWAVE_RELEASE_STORE_PASSWORD:-}" && -n "${ASTRAWAVE_RELEASE_KEY_ALIAS:-}" && -n "${ASTRAWAVE_RELEASE_KEY_PASSWORD:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/astrawave-release.jks"
            printf '%s' "$ASTRAWAVE_RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            echo "ASTRAWAVE_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ASTRAWAVE_RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Release signing credentials detected."
          else
            echo "ASTRAWAVE_RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "Signing secrets incomplete; artifacts are CI release candidates only and MUST NOT be promoted."
          fi

      - name: Build release APK and AAB
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Validate release signatures when configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ASTRAWAVE_RELEASE_SIGNED:-false}" == "true" ]]; then
            APK="app/build/outputs/apk/release/app-release.apk"
            AAB="app/build/outputs/bundle/release/app-release.aab"
            test -s "$APK"
            test -s "$AAB"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
            jarsigner -verify -strict "$AAB"
          else
            echo "Signature verification skipped because release signing is not configured."
          fi

      - name: Generate release provenance and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "git_ref=${GITHUB_REF}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "signed=${ASTRAWAVE_RELEASE_SIGNED:-false}"
            echo "promotion_eligible=${ASTRAWAVE_RELEASE_SIGNED:-false}"
            echo "generated_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > RELEASE_METADATA.txt
          cat SHA256SUMS.txt
          cat RELEASE_METADATA.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: AstraWave-release-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            android-app/app/build/outputs/**/*.apk
            android-app/app/build/outputs/**/*.aab
            android-app/app/build/outputs/SHA256SUMS.txt
            android-app/app/build/outputs/RELEASE_METADATA.txt
            android-app/app/build/reports/lint-results-*.html
            android-app/app/build/reports/lint-results-*.xml
