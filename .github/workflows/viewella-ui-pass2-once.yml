name: Viewella UI Pass 2 Once

on:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - '.github/workflows/viewella-ui-pass2-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nuvio-core-rebuild
          fetch-depth: 0

      - name: Apply Viewella-inspired navigation and secondary-surface polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Phone: keep a small icon-first bottom bar but make My Stuff reachable.
          p = Path('android-app/app/src/main/java/com/astrawave/app/ui/AstraWaveNavigationContract.kt')
          text = p.read_text()
          old = '''    val mobilePrimary = listOf(\n        AstraWaveNavItem("home", "Home"),\n        AstraWaveNavItem("movies", "Movies"),\n        AstraWaveNavItem("tv", "TV"),\n        AstraWaveNavItem("live", "Live"),\n        AstraWaveNavItem("search", "Search"),\n    )'''
          new = '''    val mobilePrimary = listOf(\n        AstraWaveNavItem("home", "Home"),\n        AstraWaveNavItem("movies", "Movies"),\n        AstraWaveNavItem("tv", "TV"),\n        AstraWaveNavItem("live", "Live"),\n        AstraWaveNavItem("search", "Search"),\n        AstraWaveNavItem("my", "My Stuff"),\n    )'''
          text = text.replace(old, new)
          text = text.replace('check(mobilePrimary.map { it.route } == listOf("home", "movies", "tv", "live", "search"))', 'check(mobilePrimary.map { it.route } == listOf("home", "movies", "tv", "live", "search", "my"))')
          p.write_text(text)

          p = Path('android-app/app/src/main/java/com/astrawave/app/RebuildMainActivity.kt')
          text = p.read_text()
          text = text.replace('label = { Text(item.label, maxLines = 1) },', 'label = { if (current == item) Text(item.label, maxLines = 1) },')
          p.write_text(text)

          # Live TV: remove dashboard kicker/copy and keep the controls visually subordinate to content.
          p = Path('android-app/app/src/main/java/com/astrawave/app/ui/LiveTvHubScreen.kt')
          text = p.read_text()
          text = text.replace('            Text("LIVE", color = AstraWaveColors.Accent, style = MaterialTheme.typography.labelLarge)\n', '')
          text = text.replace('            Text(\n                if (isPhone) "Watch what’s on now." else "Your channels, favorites and what’s on now.",\n                color = AstraWaveColors.SecondaryText,\n                style = MaterialTheme.typography.bodyMedium,\n            )\n', '')
          text = text.replace('vertical = if (isPhone) 12.dp else 16.dp,', 'vertical = if (isPhone) 8.dp else 12.dp,')
          text = text.replace('LiveModeButton("TV Sources", mode == LiveTvMode.SOURCES)', 'LiveModeButton("Sources", mode == LiveTvMode.SOURCES)')
          text = text.replace('"Try another search, group, or check TV Sources."', '"Try another search or group, or check Sources."')
          p.write_text(text)

          # Guide: make the schedule the hero; remove branded/technical preamble.
          p = Path('android-app/app/src/main/java/com/astrawave/app/ui/GuideScreen.kt')
          text = p.read_text()
          text = text.replace('        Text("ASTRAWAVE LIVE", color = AstraWaveColors.AccentStrong, style = MaterialTheme.typography.labelLarge)\n        Spacer(Modifier.height(4.dp))\n', '')
          text = text.replace('            subtitle = if (isPhone) "What is on now and next." else "Live TV on a true synchronized timeline.",', '            subtitle = if (isPhone) "Now and next" else "Now and next across your channels",')
          text = text.replace('Spacer(Modifier.height(if (isPhone) 14.dp else 18.dp))', 'Spacer(Modifier.height(if (isPhone) 8.dp else 12.dp))')
          p.write_text(text)

          # My Stuff: library first, quieter settings language.
          p = Path('android-app/app/src/main/java/com/astrawave/app/ui/MyAstraWaveHub.kt')
          text = p.read_text()
          text = text.replace('Text("MY LIBRARY"', 'Text("MY STUFF"')
          text = text.replace('Text("ACCOUNT & SETTINGS"', 'Text("SETTINGS"')
          text = text.replace('"CONNECTED SERVICES"', '"CONNECTIONS"')
          text = text.replace('Text("Experience & Web Parity"', 'Text("Experience"')
          text = text.replace('Text("Theme, density, playback, subtitles and Guide preferences"', 'Text("Theme, playback, subtitles and Guide preferences"')
          text = text.replace('Modifier.fillMaxWidth().padding(horizontal = 22.dp, vertical = 24.dp)', 'Modifier.fillMaxWidth().padding(horizontal = 22.dp, vertical = 16.dp)')
          p.write_text(text)
          PY

      - name: Compile Viewella-inspired pass 2
        working-directory: android-app
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Commit Viewella-inspired pass 2
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/astrawave/app/ui/AstraWaveNavigationContract.kt \
                  android-app/app/src/main/java/com/astrawave/app/RebuildMainActivity.kt \
                  android-app/app/src/main/java/com/astrawave/app/ui/LiveTvHubScreen.kt \
                  android-app/app/src/main/java/com/astrawave/app/ui/GuideScreen.kt \
                  android-app/app/src/main/java/com/astrawave/app/ui/MyAstraWaveHub.kt
          git commit -m "Polish navigation live guide and My Stuff UI"
          git push origin HEAD:feature/nuvio-core-rebuild
