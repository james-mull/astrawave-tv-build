name: Polish AstraWave Player Once

on:
  push:
    branches:
      - feature/nuvio-core-rebuild
    paths:
      - ".github/workflows/polish-player-once.yml"

permissions:
  contents: write

jobs:
  polish-player:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nuvio-core-rebuild
      - name: Replace internal player wording
        shell: python
        run: |
          from pathlib import Path
          path = Path('android-app/app/src/main/java/com/astrawave/app/PlayerActivity.kt')
          text = path.read_text()
          replacements = [
              ('Stream interrupted. Reconnecting current source…', 'Playback interrupted. Reconnecting…'),
              ('Current source failed. Trying backup ${streamIndex + 1} of ${streamUrls.size}…', 'Trying another playback option…'),
              ('All available sources failed. Open Sources to retry or choose another source.', 'Playback could not start. Open Playback Options to retry or choose another option.'),
              ('quickButton(if (compact) "Info" else "Stats")', 'quickButton(if (compact) "Info" else "Playback Info")'),
              ('private fun sourceLabel(): String = if (streamUrls.size <= 1) "Source" else "Source ${streamIndex + 1}/${streamUrls.size}"', 'private fun sourceLabel(): String = if (streamUrls.size <= 1) "Playback" else "Options"'),
              ('Only one source is available.', 'No alternate playback options are available.'),
              ('"${if (index == streamIndex) "✓ " else ""}Source ${index + 1} • $host"', '"${if (index == streamIndex) "✓ " else ""}Option ${index + 1} • $host"'),
              ('setTitle("Playback sources")', 'setTitle("Playback Options")'),
              ('AstraWave automatically fails over when a source stops working. You can also switch manually.', 'AstraWave automatically switches when playback fails. You can also choose an option manually.'),
              ('Switched to source ${which + 1} of ${streamUrls.size}', 'Playback option changed.'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'target not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Commit player wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/astrawave/app/PlayerActivity.kt
          git commit -m "Make player controls customer-facing"
          git push origin HEAD:feature/nuvio-core-rebuild
