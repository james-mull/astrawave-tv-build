name: Build AstraWave Web App

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-unified-app
    paths:
      - "web-app/**"
      - ".github/workflows/build-web.yml"

concurrency:
  group: astrwave-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
